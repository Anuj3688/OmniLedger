spring:
  application:
    name: omni_ledger

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    dev.fintech.omniledger: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

omniledger:
  security:
    pii:
      # 256-bit AES-GCM Key (Base64 encoded)
      encryption-key: ${OMNILEDGER_PII_KEY:k9sP2vX8qY6wZ3bA1cE5gH7jK9mN1pQ3rT5vX7yZ9aA=}
      # HMAC-SHA256 Pepper Key for blind search index (Base64 encoded)
      pepper-key: ${OMNILEDGER_PII_PEPPER:pP4kR7vT9wZ1bC3eG5jM7qS9uV1yX3aC5eG7jK9mN1p=}
